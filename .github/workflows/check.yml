name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and build report
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          bundler-cache: true
      - name: Lint
        run: bundle exec rubocop
      - name: Generate report from cached data
        run: bundle exec ruby get-data
